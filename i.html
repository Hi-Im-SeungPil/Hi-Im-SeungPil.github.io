<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Packtori</title>
  <meta property="og:title" content="Packtori 일정 공유">
  <meta property="og:description" content="Packtori에서 열면 내 여행에 바로 넣을 수 있어요.">
  <!-- 글꼴: 본문은 Pretendard(한글 · 영문), 로고 글자는 둥근 Nunito. 윈도우에 없는 글꼴만 적으면 한글이 바탕체로 보였다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --primary: #2F6FE0; --text: #191F28; --sub: #6B7684; --line: #E5E8EB; --bg: #FFFFFF; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", "Yu Gothic UI", Meiryo, "PingFang TC", "Microsoft JhengHei", "Noto Sans KR", "Noto Sans JP", "Noto Sans TC", "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 72px 24px 40px; text-align: center; }
    .icon { width: 72px; height: 72px; border-radius: 20px; background: var(--primary); margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 22px; line-height: 1.4; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.6; color: var(--sub); margin: 0; }
    .buttons { margin-top: 36px; display: flex; flex-direction: column; gap: 10px; }
    a.button { display: block; height: 52px; line-height: 52px; border-radius: 12px; font-size: 16px; font-weight: 600;
      text-decoration: none; }
    a.primary { background: var(--primary); color: #fff; }
    a.secondary { border: 1px solid var(--line); color: var(--text); }
    .note { margin-top: 20px; font-size: 13px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <div class="icon">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round">
      <path d="M8.8 8.4V6.2a1.7 1.7 0 0 1 1.7-1.7h3a1.7 1.7 0 0 1 1.7 1.7v2.2"/>
      <rect x="3.9" y="8.9" width="16.2" height="10.7" rx="2.8"/>
    </svg>
  </div>
  <h1 id="title"></h1>
  <p id="body"></p>
  <div class="buttons">
    <a id="open" class="button primary" href="#"></a>
    <a id="install" class="button secondary" href="#"></a>
  </div>
  <p id="note" class="note"></p>
</main>
<script>
  // 앱 정보. App Store 주소는 출시 후 채운다 (비어 있으면 iOS 에선 설치 버튼을 숨긴다).
  var PACKAGE = 'com.jeonfeel.easypack';
  var APP_SCHEME = 'com.jeonfeel.easypack';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=' + PACKAGE;
  var APP_STORE_URL = '';

  var TEXTS = {
    ko: { title: '여행 일정을 받았어요', body: '팩토리에서 열면 내 여행을 골라 일정에 바로 넣을 수 있어요.',
          open: '팩토리에서 열기', install: '앱 설치하기', note: '링크는 보낸 뒤 1시간 동안만 열 수 있어요. 앱이 열리기만 하고 아무것도 안 뜨면 앱을 업데이트해 주세요.',
          invalid: '링크가 올바르지 않아요.' },
    ja: { title: '旅行の日程が届きました', body: 'パックトリで開くと、自分の旅行を選んで日程にすぐ追加できます。',
          open: 'パックトリで開く', install: 'アプリをインストール', note: 'リンクは送信から1時間だけ有効です。アプリが開くだけで何も表示されない場合は、アプリをアップデートしてください。',
          invalid: 'リンクが正しくありません。' },
    zhHant: { title: '收到一份旅行行程', body: '用 Packtori 開啟，選擇自己的旅行就能直接加入行程。',
          open: '用 Packtori 開啟', install: '安裝 App', note: '連結在傳送後 1 小時內有效。若 App 開啟後沒有任何畫面，請更新 App。',
          invalid: '連結不正確。' },
    en: { title: 'You got a trip itinerary', body: 'Open it in Packtori and pick one of your trips to add it.',
          open: 'Open in Packtori', install: 'Get the app', note: 'Links work for 1 hour after they are sent. If the app opens but nothing shows up, please update it.',
          invalid: 'This link is not valid.' }
  };

  function pickTexts() {
    var lang = (navigator.language || 'ko').toLowerCase();
    if (lang.indexOf('ja') === 0) return TEXTS.ja;
    if (lang.indexOf('zh') === 0) return TEXTS.zhHant;
    if (lang.indexOf('ko') === 0) return TEXTS.ko;
    return TEXTS.en;
  }

  var t = pickTexts();
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var code = (new URLSearchParams(location.search).get('c') || '').trim().toUpperCase();
  var valid = /^[A-Z0-9]{4,12}$/.test(code);

  document.getElementById('title').textContent = t.title;
  document.getElementById('body').textContent = valid ? t.body : t.invalid;
  document.getElementById('note').textContent = t.note;

  var open = document.getElementById('open');
  var install = document.getElementById('install');
  open.textContent = t.open;
  install.textContent = t.install;

  // 링크로 앱이 안 열렸을 때(카톡 안 브라우저 등) 누르는 버튼. 안드로이드는 앱이 없으면 스토어로 간다.
  if (!valid) {
    open.classList.add('hidden');
  } else if (isAndroid) {
    open.href = 'intent://i?c=' + code + '#Intent;scheme=' + APP_SCHEME + ';package=' + PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end';
  } else {
    open.href = APP_SCHEME + '://i?c=' + code;
  }

  if (isIOS) {
    if (APP_STORE_URL) install.href = APP_STORE_URL; else install.classList.add('hidden');
  } else {
    install.href = PLAY_URL;
  }
</script>
</body>
</html>
